# Build matrix: CUDA × Python
# PyTorch version is determined by conda-forge's pytorch package matching cuda-version

cuda_compiler_version:
  - "12.6"
  - "12.8"
  - "12.9"
  - "13.0"

python:
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"

# Ensure we don't build cpu variants
cuda_compiler:
  - cuda
