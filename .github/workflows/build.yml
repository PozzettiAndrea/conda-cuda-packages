name: Build Conda Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build'
        required: true
        type: choice
        options:
          - all
          - cc_torch
          - torch_generic_nms
      cuda:
        description: 'CUDA version (or "all")'
        required: false
        default: '12.8'
        type: string
      python:
        description: 'Python version (or "all")'
        required: false
        default: '3.12'
        type: string
      pytorch:
        description: 'PyTorch version (or "all")'
        required: false
        default: '2.11.0'
        type: string

jobs:
  build:
    name: "${{ inputs.package }} | cuda${{ inputs.cuda }} | py${{ inputs.python }} | torch${{ inputs.pytorch }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rattler-build
        run: |
          curl -fsSL https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /usr/local/bin/ --strip-components=1
          rattler-build --version

      - name: Build package
        run: |
          VARIANT_ARGS=""
          if [ "${{ inputs.cuda }}" != "all" ]; then
            VARIANT_ARGS="$VARIANT_ARGS --variant cuda_compiler_version=${{ inputs.cuda }}"
          fi
          if [ "${{ inputs.python }}" != "all" ]; then
            VARIANT_ARGS="$VARIANT_ARGS --variant python=${{ inputs.python }}"
          fi
          if [ "${{ inputs.pytorch }}" != "all" ]; then
            VARIANT_ARGS="$VARIANT_ARGS --variant pytorch=${{ inputs.pytorch }}"
          fi

          rattler-build build --no-build-id --allow-network \
            --recipe recipes/${{ inputs.package }}/recipe.yaml \
            --variant-config variants.yaml \
            --channel conda-forge \
            --channel nvidia \
            --channel pytorch \
            $VARIANT_ARGS \
            2>&1 | tee build.log

      - name: Upload to anaconda.org
        if: success()
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          pip install "anaconda-client<1.14"
          find output/ -name "*.conda" -exec \
            anaconda upload --force {} \;

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-cuda${{ inputs.cuda }}-py${{ inputs.python }}-torch${{ inputs.pytorch }}
          path: output/**/*.conda
