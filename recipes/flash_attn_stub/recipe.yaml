context:
  name: flash_attn
  version: "2.8.3"

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  noarch: generic
  number: 0
  # Build string starts with "cpu_" so it sorts BEFORE the real GPU builds
  # (cu12.8_..., cu12.6_..., etc.) lexicographically. Conda's tiebreaker after
  # version + build_number is the build string — GREATER wins. 'cu' > 'cp', so
  # GPU builds always beat this stub when both resolve. The stub only "wins"
  # when GPU builds are filtered out by missing __cuda virtual.
  string: "cpu_stub"
  script:
    content:
      - if: unix
        then: |
          mkdir -p "$PREFIX/share/${{ name }}"
          cat > "$PREFIX/share/${{ name }}/STUB.txt" <<'EOF'
          ${{ name }} CPU stub.

          This artifact installs no Python module. The real ${{ name }} package
          is GPU-only; on hosts without CUDA the conda solver picks this stub so
          dependent environments still build. Importing ${{ name }} in Python
          will raise ModuleNotFoundError, and the consuming code is expected to
          catch that and fall back to a CPU implementation.
          EOF
        else: |
          if not exist "%PREFIX%\share\${{ name }}" mkdir "%PREFIX%\share\${{ name }}"
          > "%PREFIX%\share\${{ name }}\STUB.txt" echo ${{ name }} CPU stub - no Python module installed.

requirements:
  run: []

about:
  homepage: https://github.com/Dao-AILab/flash-attention
  license: BSD-3-Clause
  summary: CPU-only stub for flash_attn (real package is GPU-only). Installs no module so `import flash_attn` raises ModuleNotFoundError.
