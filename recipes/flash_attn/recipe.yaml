context:
  name: flash_attn
  version: "2.8.3"
  source_repo: "Dao-AILab/flash-attention"
  source_tag: "v2.8.3"
  arch_list: ${{ "8.0 9.0 10.0 12.0" if cuda_compiler_version in ("12.8", "12.9", "13.0") else "8.0 9.0" }}
  cuda_short: ${{ cuda_compiler_version | replace('.', '') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/${{ source_repo }}.git
  tag: ${{ source_tag }}
  depth: 1

build:
  number: 0
  string: "cu${{ cuda_compiler_version }}_torch${{ pytorch }}_py${{ python }}_${{ target_platform }}"
  script:
    content:
      - if: unix
        then: |
          # Init cutlass submodule (skip composable_kernel - ROCm only)
          git submodule update --init csrc/cutlass

          # Inline patch: bridge TORCH_CUDA_ARCH_LIST -> FLASH_ATTN_CUDA_ARCHS
          python -c "
          import os; from pathlib import Path
          f=Path('setup.py'); c=f.read_text()
          c=c.replace('subprocess.run([\"git\", \"submodule\", \"update\", \"--init\", \"csrc/composable_kernel\"])','pass')
          c=c.replace('subprocess.run([\"git\", \"submodule\", \"update\", \"--init\", \"csrc/cutlass\"])','pass')
          old='def cuda_archs() -> str:\n    return os.getenv(\"FLASH_ATTN_CUDA_ARCHS\", \"80;90;100;120\").split(\";\")'
          new='def cuda_archs() -> str:\n    a=os.getenv(\"FLASH_ATTN_CUDA_ARCHS\")\n    if a: return a.split(\";\")\n    t=os.getenv(\"TORCH_CUDA_ARCH_LIST\",\"\")\n    if t: return [x.replace(\".\",\"\") for x in t.split()]\n    return [\"80\",\"90\",\"100\",\"120\"]'
          if old in c: c=c.replace(old,new); print('Patched cuda_archs')
          else: print('WARN: cuda_archs not found')
          f.write_text(c); print('Done')
          "

          PY_TAG="cp${{ python | replace('.', '') }}"
          BASE="torch-${{ pytorch_full }}%2Bcu${{ cuda_short }}-${PY_TAG}-${PY_TAG}"
          URL="https://download.pytorch.org/whl/cu${{ cuda_short }}"
          curl -fSL "${URL}/${BASE}-manylinux_2_28_x86_64.whl" -o /tmp/torch.whl 2>/dev/null || \
          curl -fSL "${URL}/${BASE}-linux_x86_64.whl" -o /tmp/torch.whl
          mkdir -p /tmp/torch_pkg
          unzip -q /tmp/torch.whl -d /tmp/torch_pkg/
          rm /tmp/torch.whl
          export PYTHONPATH="/tmp/torch_pkg:$PYTHONPATH"
          export LD_LIBRARY_PATH="/tmp/torch_pkg/torch/lib:$LD_LIBRARY_PATH"
          export CUDA_HOME="$PREFIX"
          export MAX_JOBS=3
          export NVCC_THREADS=1
          export NVCC_APPEND_FLAGS="${NVCC_APPEND_FLAGS:-} -Xcompiler -Wno-deprecated-declarations --time ${SRC_DIR}/nvcc_times.csv"
          # Also suppress for .cpp files compiled directly by gcc (not via nvcc)
          export CFLAGS="${CFLAGS:-} -Wno-deprecated-declarations"
          export CXXFLAGS="${CXXFLAGS:-} -Wno-deprecated-declarations"
          echo "================================================================"
          echo "BUILD PARAMETERS:"
          echo "  TORCH_CUDA_ARCH_LIST=$TORCH_CUDA_ARCH_LIST"
          echo "  FLASH_ATTENTION_FORCE_BUILD=$FLASH_ATTENTION_FORCE_BUILD"
          echo "  MAX_JOBS=$MAX_JOBS"
          echo "  NVCC_THREADS=${NVCC_THREADS:-default(2)}"
          echo "  FORCE_CUDA=$FORCE_CUDA"
          echo "  CUDA_HOME=$CUDA_HOME"
          echo "  NVCC_APPEND_FLAGS=$NVCC_APPEND_FLAGS"
          echo "  CPU count: $(nproc)"
          echo "  Free mem: $(free -g | awk '/^Mem:/ {print $7}')GB"
          echo "  Swap total: $(free -g | awk '/^Swap:/ {print $2}')GB"
          echo "================================================================"

          # nvcc wrapper - replace $PREFIX/bin/nvcc since torch's cpp_extension
          # calls it directly via $CUDA_HOME, bypassing PATH.
          export NVCC_MEM_LOG=/tmp/nvcc-mem.log
          : > $NVCC_MEM_LOG
          if [ -f "$PREFIX/bin/nvcc" ] && [ ! -f "$PREFIX/bin/nvcc.real" ]; then
            mv $PREFIX/bin/nvcc $PREFIX/bin/nvcc.real
            cp $RECIPE_DIR/nvcc-wrap.sh $PREFIX/bin/nvcc
            chmod +x $PREFIX/bin/nvcc
            echo "nvcc wrapper installed at $PREFIX/bin/nvcc -> $PREFIX/bin/nvcc.real"
          fi

          # Background memory sampler (every 30s)
          (
            while true; do
              ts=$(date +%H:%M:%S)
              memline=$(free -m | awk '/^Mem:/ {printf "free=%dMB used=%dMB", $7, $3}')
              swapline=$(free -m | awk '/^Swap:/ {printf "swap_used=%dMB", $3}')
              top=$(ps --no-headers -eo rss,comm --sort=-rss | head -4 | awk '{printf "%s=%dMB ", $2, $1/1024}')
              echo "[mem-sample] $ts  $memline  $swapline  top: $top"
              sleep 30
            done
          ) &
          SAMPLER_PID=$!
          trap "kill $SAMPLER_PID 2>/dev/null || true" EXIT

          $PYTHON -m pip install . --no-deps --no-build-isolation -vv
          PIP_RC=$?

          # Stop sampler and print peak RSS summary
          kill $SAMPLER_PID 2>/dev/null || true
          echo ""
          echo "================ NVCC PEAK RSS PER FILE ================"
          if [ -s "$NVCC_MEM_LOG" ]; then
            sort -t= -k2 -nr "$NVCC_MEM_LOG"
            echo ""
            worst=$(sort -t= -k2 -nr "$NVCC_MEM_LOG" | head -1)
            echo "Worst: $worst"
            worst_kib=$(echo "$worst" | grep -oE 'peak_kib=[0-9]+' | cut -d= -f2)
            if [ -n "$worst_kib" ]; then
              echo "Worst peak: $((worst_kib / 1024)) MB"
            fi
          else
            echo "(no nvcc invocations logged)"
          fi
          echo "========================================================="

          echo "================ NVCC PHASE TIMES ================"
          if [ -s "${SRC_DIR}/nvcc_times.csv" ]; then
            head -1 "${SRC_DIR}/nvcc_times.csv"
            tail -n +2 "${SRC_DIR}/nvcc_times.csv" | sort -t, -k2 -nr | head -20
          else
            echo "(no timing data)"
          fi
          echo "==================================================="

          exit $PIP_RC
        else: |
          git submodule update --init csrc/cutlass

          python -c "from pathlib import Path;f=Path('setup.py');c=f.read_text();c=c.replace('subprocess.run([\"git\", \"submodule\", \"update\", \"--init\", \"csrc/composable_kernel\"])','pass');c=c.replace('subprocess.run([\"git\", \"submodule\", \"update\", \"--init\", \"csrc/cutlass\"])','pass');f.write_text(c);print('Patched')"

          set PY_TAG=cp${{ python | replace('.', '') }}
          set BASE=torch-${{ pytorch_full }}%%2Bcu${{ cuda_short }}-%PY_TAG%-%PY_TAG%
          set URL=https://download.pytorch.org/whl/cu${{ cuda_short }}
          curl -fSL "%URL%/%BASE%-win_amd64.whl" -o %TEMP%\torch.whl
          python -m zipfile -e %TEMP%\torch.whl %TEMP%\torch_pkg
          del %TEMP%\torch.whl
          set "PYTHONPATH=%TEMP%\torch_pkg;%PYTHONPATH%"
          set "PATH=%TEMP%\torch_pkg\torch\lib;%PATH%"
          echo. > %TEMP%\mem_sample.flag
          start /B "" powershell -NoProfile -ExecutionPolicy Bypass -Command "while (Test-Path '%TEMP%\mem_sample.flag') { $os = Get-CimInstance Win32_OperatingSystem; $free = [int]($os.FreePhysicalMemory / 1024); $used = [int]($os.TotalVisibleMemorySize / 1024) - $free; $top = (Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 4 | ForEach-Object { '{0}={1}MB' -f $_.Name, [int]($_.WorkingSet64/1MB) }) -join ' '; Write-Host ('[mem-sample] {0}  free={1}MB  used={2}MB  top: {3}' -f (Get-Date -Format HH:mm:ss), $free, $used, $top); Start-Sleep 30 }"
          %PYTHON% -c "import sys,os,subprocess,glob;prefix=os.path.dirname(sys.executable);lib=os.path.join(prefix,'Library');os.environ['CUDA_HOME']=lib;os.environ['CL']='/permissive- /wd4996';os.environ['MAX_JOBS']='3';os.environ['NVCC_THREADS']='1';os.environ['NVCC_APPEND_FLAGS']=os.environ.get('NVCC_APPEND_FLAGS','')+' -Xcompiler /wd4996';os.environ['PATH']=os.path.join(lib,'bin')+';'+os.environ.get('PATH','');vs=r'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC';vers=sorted(glob.glob(os.path.join(vs,'14.*')));latest=vers[-1] if vers else '';inc=os.environ.get('INCLUDE','');lib2=os.environ.get('LIB','');path=os.environ.get('PATH','');[os.environ.update({'INCLUDE':inc.replace(old,os.path.basename(latest)),'LIB':lib2.replace(old,os.path.basename(latest)),'PATH':path.replace(old,os.path.basename(latest))}) for old in ['14.29.30133'] if latest];subprocess.check_call([sys.executable,'-m','pip','install','.','--no-deps','--no-build-isolation','-vv'])"
          del %TEMP%\mem_sample.flag 2>nul
    env:
      FORCE_CUDA: "1"
      TORCH_CUDA_ARCH_LIST: ${{ arch_list }}
      NVCC_APPEND_FLAGS: "-diag-suppress 221"
      # 0 = let pip use upstream's prebuilt wheel when one matches (fast).
      # Set to 1 to force-build from source (slow but produces a wheel matched
      # to the exact pytorch+cuda+arch list above).
      FLASH_ATTENTION_FORCE_BUILD: "0"

requirements:
  build:
    - if: linux
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - patchelf
  host:
    - python
    - pip
    - setuptools
    - typing_extensions
    - psutil
    - cuda-nvcc ${{ cuda_compiler_version }}.*
    - cuda-cudart-dev ${{ cuda_compiler_version }}.*
    - cuda-cccl
    - libcusparse-dev
    - libcublas-dev
    - libcufft-dev
    - libcurand-dev
    - libcusolver-dev
    - if: linux
      then:
        - libcudnn >=9
        - libcublas
        - libcufft
        - libcurand
        - libcusolver
        - libcusparse
        - cusparselt
        - libnvjitlink
        - libcufile
        - cuda-nvrtc
        - cuda-cupti
        - cuda-nvtx
        - nccl
        - libnvshmem3
  run:
    - python
    - __cuda
    - cuda-cudart
    # Hard pin on the matching pytorch minor: forces the conda solver to pick a
    # flash_attn build whose torch ABI matches whatever pytorch lands in the
    # env. Replaces the previous loose `run_constraints: pytorch >=X`, which
    # conda silently ignored when pytorch came from pip instead of conda.
    - pytorch ${{ pytorch }}.*


about:
  homepage: https://github.com/Dao-AILab/flash-attention
  license: BSD-3-Clause
  summary: Fast and memory-efficient exact attention
