context:
  name: cc_torch
  version: "0.1.0"
  source_repo: "ronghanghu/cc_torch"
  commit: "446e9360ed10d3c8d03925ccb5f220ccb62009de"
  arch_list: ${{ "8.0;9.0;10.0;12.0+PTX" if cuda_compiler_version == "13.0" else ("7.0;8.0;9.0;10.0;12.0+PTX" if cuda_compiler_version in ("12.8", "12.9") else ("5.0;6.0;7.0;8.0;9.0+PTX" if cuda_compiler_version == "12.4" else "7.0;8.0;9.0+PTX")) }}
  cuda_short: ${{ cuda_compiler_version | replace('.', '') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/${{ source_repo }}.git
  rev: ${{ commit }}
  depth: 1

build:
  number: 0
  script:
    content:
      - $PYTHON -m pip install . --no-deps --no-build-isolation -vv
    env:
      FORCE_CUDA: "1"
      TORCH_CUDA_ARCH_LIST: ${{ arch_list }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - pytorch
    - cuda-nvcc ${{ cuda_compiler_version }}.*
    - cuda-cudart-dev ${{ cuda_compiler_version }}.*
    - cuda-cccl
  run:
    - python
    - pytorch
    - __cuda
    - cuda-cudart
  run_constraints:
    - cuda-version >=${{ cuda_compiler_version }}

tests:
  - python:
      imports:
        - cc_torch

about:
  homepage: https://github.com/ronghanghu/cc_torch
  license: MIT
  summary: Connected Components for PyTorch (CUDA)
