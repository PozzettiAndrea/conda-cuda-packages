context:
  name: cc_torch
  version: "0.1.0"
  source_repo: "ronghanghu/cc_torch"
  commit: "446e9360ed10d3c8d03925ccb5f220ccb62009de"
  arch_list: ${{ "8.0;9.0;10.0;12.0+PTX" if cuda_compiler_version == "13.0" else ("7.0;8.0;9.0;10.0;12.0+PTX" if cuda_compiler_version in ("12.8", "12.9") else ("5.0;6.0;7.0;8.0;9.0+PTX" if cuda_compiler_version == "12.4" else "7.0;8.0;9.0+PTX")) }}
  cuda_short: ${{ cuda_compiler_version | replace('.', '') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/${{ source_repo }}.git
  rev: ${{ commit }}
  depth: 1

build:
  number: 0
  script:
    content:
      - |
        PY_TAG="cp${{ python | replace('.', '') }}"
        TORCH_WHL="torch-${{ pytorch }}%2Bcu${{ cuda_short }}-${PY_TAG}-${PY_TAG}-manylinux_2_28_x86_64.whl"
        curl -fSL "https://download.pytorch.org/whl/cu${{ cuda_short }}/${TORCH_WHL}" -o /tmp/torch.whl
        mkdir -p /tmp/torch_pkg
        unzip -q /tmp/torch.whl -d /tmp/torch_pkg/
        rm /tmp/torch.whl
        export PYTHONPATH="/tmp/torch_pkg:$PYTHONPATH"
        export LD_LIBRARY_PATH="/tmp/torch_pkg/torch/lib:$LD_LIBRARY_PATH"
        $PYTHON -m pip install . --no-deps --no-build-isolation -vv
    env:
      FORCE_CUDA: "1"
      TORCH_CUDA_ARCH_LIST: ${{ arch_list }}
      CUDA_HOME: $PREFIX

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - patchelf
  host:
    - python
    - pip
    - setuptools
    - typing_extensions
    - cuda-nvcc ${{ cuda_compiler_version }}.*
    - cuda-cudart-dev ${{ cuda_compiler_version }}.*
    - cuda-cccl
    - libcusparse-dev
    - libcublas-dev
    - libcufft-dev
    - libcurand-dev
    - libcusolver-dev
    - libcudnn >=9
    - libcublas
    - libcufft
    - libcurand
    - libcusolver
    - libcusparse
    - cusparselt
    - libnvjitlink
    - libcufile
    - cuda-nvrtc
    - cuda-cupti
    - cuda-nvtx
    - nccl
    - libnvshmem3
  run:
    - python
    - __cuda
    - cuda-cudart
  run_constraints:
    - cuda-version >=${{ cuda_compiler_version }}
    - pytorch >=${{ pytorch }}


about:
  homepage: https://github.com/ronghanghu/cc_torch
  license: MIT
  summary: Connected Components for PyTorch (CUDA)
