context:
  name: torch_generic_nms
  version: "0.1.0"
  source_repo: "ronghanghu/torch_generic_nms"
  commit: "fcf02b41ea9b37988b244ef80583af17baa4a7f0"
  arch_list: ${{ "8.0;9.0;10.0;12.0+PTX" if cuda_compiler_version == "13.0" else ("7.0;8.0;9.0;10.0;12.0+PTX" if cuda_compiler_version in ("12.8", "12.9") else ("5.0;6.0;7.0;8.0;9.0+PTX" if cuda_compiler_version == "12.4" else "7.0;8.0;9.0+PTX")) }}
  cuda_short: ${{ cuda_compiler_version | replace('.', '') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/${{ source_repo }}.git
  rev: ${{ commit }}
  depth: 1

build:
  number: 0
  string: "cu${{ cuda_compiler_version }}_torch${{ pytorch }}_py${{ python }}_${{ target_platform }}"
  script:
    content:
      - if: unix
        then: |
          PY_TAG="cp${{ python | replace('.', '') }}"
          BASE="torch-${{ pytorch_full }}%2Bcu${{ cuda_short }}-${PY_TAG}-${PY_TAG}"
          URL="https://download.pytorch.org/whl/cu${{ cuda_short }}"
          curl -fSL "${URL}/${BASE}-manylinux_2_28_x86_64.whl" -o /tmp/torch.whl 2>/dev/null || \
          curl -fSL "${URL}/${BASE}-linux_x86_64.whl" -o /tmp/torch.whl
          mkdir -p /tmp/torch_pkg
          unzip -q /tmp/torch.whl -d /tmp/torch_pkg/
          rm /tmp/torch.whl
          export PYTHONPATH="/tmp/torch_pkg:$PYTHONPATH"
          export LD_LIBRARY_PATH="/tmp/torch_pkg/torch/lib:$LD_LIBRARY_PATH"
          export CUDA_HOME="$PREFIX"

          echo "================================================================"
          echo "BUILD PARAMETERS:"
          echo "  TORCH_CUDA_ARCH_LIST=$TORCH_CUDA_ARCH_LIST"
          echo "  CUDA_HOME=$CUDA_HOME"
          echo "  CPU count: $(nproc)"
          echo "  Free mem: $(free -g | awk '/^Mem:/ {print $7}')GB"
          echo "  Swap total: $(free -g | awk '/^Swap:/ {print $2}')GB"
          echo "================================================================"

          # nvcc wrapper for per-file peak RSS measurement
          # torch's cpp_extension calls $CUDA_HOME/bin/nvcc directly, bypassing PATH.
          # Replace $PREFIX/bin/nvcc with our wrapper and stash the real one.
          export NVCC_MEM_LOG=/tmp/nvcc-mem.log
          : > $NVCC_MEM_LOG
          if [ -f "$PREFIX/bin/nvcc" ] && [ ! -f "$PREFIX/bin/nvcc.real" ]; then
            mv $PREFIX/bin/nvcc $PREFIX/bin/nvcc.real
            cp $RECIPE_DIR/nvcc-wrap.sh $PREFIX/bin/nvcc
            chmod +x $PREFIX/bin/nvcc
            echo "nvcc wrapper installed at $PREFIX/bin/nvcc -> $PREFIX/bin/nvcc.real"
          fi

          # Background memory sampler (every 30s)
          (
            while true; do
              ts=$(date +%H:%M:%S)
              memline=$(free -m | awk '/^Mem:/ {printf "free=%dMB used=%dMB", $7, $3}')
              swapline=$(free -m | awk '/^Swap:/ {printf "swap_used=%dMB", $3}')
              top=$(ps --no-headers -eo rss,comm --sort=-rss | head -4 | awk '{printf "%s=%dMB ", $2, $1/1024}')
              echo "[mem-sample] $ts  $memline  $swapline  top: $top"
              sleep 30
            done
          ) &
          SAMPLER_PID=$!
          trap "kill $SAMPLER_PID 2>/dev/null || true" EXIT

          $PYTHON -m pip install . --no-deps --no-build-isolation -vv
          PIP_RC=$?

          kill $SAMPLER_PID 2>/dev/null || true
          echo ""
          echo "================ NVCC PEAK RSS PER FILE ================"
          if [ -s "$NVCC_MEM_LOG" ]; then
            sort -t= -k2 -nr "$NVCC_MEM_LOG"
            echo ""
            worst=$(sort -t= -k2 -nr "$NVCC_MEM_LOG" | head -1)
            echo "Worst: $worst"
            worst_kib=$(echo "$worst" | grep -oE 'peak_kib=[0-9]+' | cut -d= -f2)
            if [ -n "$worst_kib" ]; then
              echo "Worst peak: $((worst_kib / 1024)) MB"
            fi
          else
            echo "(no nvcc invocations logged)"
          fi
          echo "========================================================="
          exit $PIP_RC
        else: |
          set PY_TAG=cp${{ python | replace('.', '') }}
          set BASE=torch-${{ pytorch_full }}%%2Bcu${{ cuda_short }}-%PY_TAG%-%PY_TAG%
          set URL=https://download.pytorch.org/whl/cu${{ cuda_short }}
          curl -fSL "%URL%/%BASE%-win_amd64.whl" -o %TEMP%\torch.whl
          python -m zipfile -e %TEMP%\torch.whl %TEMP%\torch_pkg
          del %TEMP%\torch.whl
          set "PYTHONPATH=%TEMP%\torch_pkg;%PYTHONPATH%"
          set "PATH=%TEMP%\torch_pkg\torch\lib;%PATH%"
          %PYTHON% -c "import sys,os,subprocess,glob;prefix=os.path.dirname(sys.executable);lib=os.path.join(prefix,'Library');os.environ['CUDA_HOME']=lib;os.environ['CL']='/permissive-';os.environ['PATH']=os.path.join(lib,'bin')+';'+os.environ.get('PATH','');vs=r'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC';vers=sorted(glob.glob(os.path.join(vs,'14.*')));latest=vers[-1] if vers else '';print('Using MSVC:',latest);inc=os.environ.get('INCLUDE','');lib2=os.environ.get('LIB','');path=os.environ.get('PATH','');[os.environ.update({'INCLUDE':inc.replace(old,os.path.basename(latest)),'LIB':lib2.replace(old,os.path.basename(latest)),'PATH':path.replace(old,os.path.basename(latest))}) for old in ['14.29.30133'] if latest];subprocess.check_call([sys.executable,'-m','pip','install','.','--no-deps','--no-build-isolation','-vv'])"
    env:
      FORCE_CUDA: "1"
      TORCH_CUDA_ARCH_LIST: ${{ arch_list }}

requirements:
  build:
    - if: linux
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - patchelf
  host:
    - python
    - pip
    - setuptools
    - typing_extensions
    - cuda-nvcc ${{ cuda_compiler_version }}.*
    - cuda-cudart-dev ${{ cuda_compiler_version }}.*
    - cuda-cccl
    - libcusparse-dev
    - libcublas-dev
    - libcufft-dev
    - libcurand-dev
    - libcusolver-dev
    - if: linux
      then:
        - libcudnn >=9
        - libcublas
        - libcufft
        - libcurand
        - libcusolver
        - libcusparse
        - cusparselt
        - libnvjitlink
        - libcufile
        - cuda-nvrtc
        - cuda-cupti
        - cuda-nvtx
        - nccl
        - libnvshmem3
  run:
    - python
    - __cuda
    - cuda-cudart
    # Hard pin on the matching pytorch minor: forces the conda solver to pick a
    # torch_generic_nms build whose torch ABI matches whatever pytorch lands in
    # the env. Replaces the previous loose `run_constraints: pytorch >=X`,
    # which conda silently ignored when pytorch came from pip instead of conda.
    - pytorch ${{ pytorch }}.*


about:
  homepage: https://github.com/ronghanghu/torch_generic_nms
  license: MIT
  summary: Generic Non-Maximum Suppression for PyTorch (CUDA)
